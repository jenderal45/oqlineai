<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Scorpio AI</title>

    <link rel="stylesheet" href="/style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="app">

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <aside class="sidebar">

        <div class="sidebar-top">

            <button id="newChatBtn"
                    class="new-chat">

                <span>＋</span>

                <span>New Chat</span>

            </button>

        </div>

        <div class="history-title">

            Percakapan

        </div>

        <div id="historyList"
             class="history-list">

            <div class="history-item active">

                Chat Baru

            </div>

        </div>

        <div class="sidebar-bottom">

            <div class="app-version">

                Scorpio AI

                <small>

                    Version 2.0

                </small>

            </div>

        </div>

    </aside>

    <!-- ========================= -->
    <!-- CONTENT -->
    <!-- ========================= -->

    <section class="content">

        <!-- HEADER -->

        <header class="topbar">

            <div class="logo-area">

                <div class="logo">

                    🦂

                </div>

                <div class="logo-text">

                    Scorpio AI

                </div>

            </div>

            <div class="top-actions">

                <select id="modelSelect">

                    <optgroup label="FREE">

                        <option value="google/gemma-3-27b-it:free">

                            Gemma 3 27B

                        </option>

                        <option value="qwen/qwen3-235b-a22b:free">

                            Qwen 3 235B

                        </option>

                        <option value="moonshotai/kimi-k2:free">

                            Kimi K2

                        </option>

                    </optgroup>

                    <optgroup label="PREMIUM">

                        <option value="google/gemini-2.5-flash">

                            Gemini 2.5 Flash

                        </option>

                        <option value="anthropic/claude-sonnet-4">

                            Claude Sonnet 4

                        </option>

                        <option value="openai/gpt-4.1-mini">

                            GPT-4.1 Mini

                        </option>

                        <option value="deepseek/deepseek-chat-v3-0324">

                            DeepSeek V3

                        </option>

                    </optgroup>

                </select>

            </div>

        </header>

        <!-- CHAT -->

        <main id="chatArea"
              class="chat-area">

            <div id="emptyState"
                 class="welcome">

                <div class="welcome-logo">

                    🦂

                </div>

                <h1>

                    Scorpio AI

                </h1>

                <p>

                    Apa yang ingin Anda kerjakan hari ini?

                </p>

                <div class="quick-grid">

                    <button class="suggestion-chip">

                        ✍️ Tulis Artikel

                    </button>

                    <button class="suggestion-chip">

                        💻 Buat Kode

                    </button>

                    <button class="suggestion-chip">

                        📊 Analisis Data

                    </button>

                    <button class="suggestion-chip">

                        🚀 Ide Bisnis

                    </button>

                    <button class="suggestion-chip">

                        📑 Ringkas Dokumen

                    </button>

                    <button class="suggestion-chip">

                        🎯 Strategi Marketing

                    </button>

                </div>

            </div>

        </main>

                <!-- ========================= -->
        <!-- FOOTER -->
        <!-- ========================= -->

        <footer class="chat-footer">

            <div class="input-container">

                <div class="input-toolbar">

                    <button
                        class="tool-btn"
                        id="uploadBtn"
                        title="Upload File">

                        📎

                    </button>

                    <input
                        type="file"
                        id="fileInput"
                        hidden>

                    <button
                        class="tool-btn"
                        id="voiceBtn"
                        title="Voice">

                        🎤

                    </button>

                </div>

                <textarea

                    id="userInput"

                    rows="1"

                    placeholder="Ketik pesan untuk Scorpio AI...">

                </textarea>

                <button

                    id="sendBtn"

                    class="send-btn"

                    title="Kirim">

                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none">

                        <path

                            d="M5 12L19 12"

                            stroke="currentColor"

                            stroke-width="2"

                            stroke-linecap="round"/>

                        <path

                            d="M13 6L19 12L13 18"

                            stroke="currentColor"

                            stroke-width="2"

                            stroke-linecap="round"

                            stroke-linejoin="round"/>

                    </svg>

                </button>

            </div>

            <div class="footer-note">

                AI dapat menghasilkan informasi yang kurang tepat.
                Selalu lakukan verifikasi untuk keputusan penting.

            </div>

        </footer>

    </section>

</div>

<!-- ========================= -->
<!-- MODAL SETTINGS -->
<!-- ========================= -->

<div
    id="settingsModal"
    class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>

                Pengaturan

            </h2>

            <button
                id="closeSettings">

                ✕

            </button>

        </div>

        <div class="modal-body">

            <div class="setting-item">

                <label>

                    Tema

                </label>

                <select id="themeSelect">

                    <option value="dark">

                        Dark

                    </option>

                    <option value="light">

                        Light

                    </option>

                </select>

            </div>

            <div class="setting-item">

                <label>

                    Bahasa

                </label>

                <select id="languageSelect">

                    <option value="id">

                        Bahasa Indonesia

                    </option>

                    <option value="en">

                        English

                    </option>

                </select>

            </div>

        </div>

    </div>

</div>

<script src="/app.js"></script>
